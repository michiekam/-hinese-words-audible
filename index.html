<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Chinese Word Practice</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: sans-serif; background: #fdf6e3; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 20px 16px; gap: 16px; }
  h1 { font-size: 1.2rem; color: #555; }

  .btn { padding: 13px 18px; border: none; border-radius: 10px; font-size: 1rem; cursor: pointer; }
  .btn-primary { background: #e07b39; color: #fff; width: 100%; }
  .btn-green { background: #5a9e5a; color: #fff; }
  .btn-gray { background: #ddd; color: #333; }

  /* Scan */
  #scan-screen { width: 100%; max-width: 500px; display: flex; flex-direction: column; gap: 12px; }
  #preview { width: 100%; border-radius: 10px; display: none; }
  #status { text-align: center; color: #888; font-size: 0.9rem; min-height: 1.2em; }
  #file-input { display: none; }

  /* Review */
  #review-screen { display: none; width: 100%; max-width: 600px; flex-direction: column; gap: 14px; }
  #review-screen h2 { font-size: 1rem; color: #555; }
  .lesson-block { background: #fff; border-radius: 10px; padding: 12px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
  .lesson-header { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .lesson-title { font-weight: bold; font-size: 0.95rem; color: #444; flex: 1; }
  .lesson-title input { border: 1px solid #ccc; border-radius: 6px; padding: 3px 7px; font-size: 0.9rem; width: 100px; }
  .words-grid { display: flex; flex-wrap: wrap; gap: 8px; min-height: 36px; border-radius: 8px; padding: 4px; transition: background 0.15s; }
  .words-grid.drop-target { background: #fde8d4; outline: 2px dashed #e07b39; }
  .word-chip { display: flex; align-items: center; gap: 4px; background: #f0e6d3; border-radius: 20px; padding: 6px 12px; font-size: 1.3rem; cursor: grab; user-select: none; }
  .word-chip.dragging { opacity: 0.4; cursor: grabbing; }
  .word-chip.drag-over { outline: 2px dashed #e07b39; }
  .word-chip .del { cursor: pointer; color: #aaa; font-size: 0.8rem; line-height: 1; }
  .word-chip .del:hover { color: #e05555; }
  .add-word-row { display: flex; gap: 8px; margin-top: 10px; }
  .add-word-row input { flex: 1; border: 1px solid #ccc; border-radius: 8px; padding: 7px 10px; font-size: 1.1rem; }
  .del-lesson { background: none; border: none; color: #ccc; font-size: 1.1rem; cursor: pointer; }
  .del-lesson:hover { color: #e05555; }
  #add-lesson-btn { background: none; border: 2px dashed #ccc; border-radius: 10px; padding: 10px; color: #aaa; font-size: 0.95rem; cursor: pointer; width: 100%; }
  #add-lesson-btn:hover { border-color: #e07b39; color: #e07b39; }
  #start-btn { background: #4a90d9; color: #fff; font-size: 1.1rem; padding: 15px; border-radius: 12px; border: none; cursor: pointer; width: 100%; }

  /* Practice */
  #practice-screen { display: none; width: 100%; max-width: 480px; flex-direction: column; align-items: center; gap: 18px; }
  #lesson-tabs { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
  .tab { padding: 7px 14px; border-radius: 20px; border: 2px solid #ddd; background: #fff; font-size: 0.85rem; cursor: pointer; color: #666; }
  .tab.active { border-color: #4a90d9; background: #4a90d9; color: #fff; }
  #progress { color: #aaa; font-size: 0.9rem; }
  #word-box { font-size: 6rem; min-height: 110px; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #333; visibility: hidden; }
  #pinyin-box { font-size: 1.3rem; color: #e07b39; letter-spacing: 0.15em; min-height: 1.6em; }
  #speak-btn { background: #4a90d9; color: #fff; font-size: 1rem; width: 100%; padding: 15px; border-radius: 12px; border: none; cursor: pointer; }
  .nav-row { display: flex; gap: 12px; width: 100%; }
  .nav-row .btn { flex: 1; }
  #reveal-btn { background: #7cb87c; color: #fff; width: 100%; }
  #back-btn { background: none; border: none; color: #aaa; font-size: 0.85rem; cursor: pointer; text-decoration: underline; }

  /* Handwriting modal */
  #hw-modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 100; align-items: center; justify-content: center; }
  #hw-modal.open { display: flex; }
  #hw-box { background: #fff; border-radius: 14px; padding: 18px; display: flex; flex-direction: column; gap: 12px; align-items: center; width: 300px; }
  #hw-box h3 { font-size: 1rem; color: #555; }
  #hw-canvas { border: 2px solid #ccc; border-radius: 8px; touch-action: none; cursor: crosshair; background: #fff; }
  #hw-result { font-size: 2rem; min-height: 2.5rem; color: #333; }
  .hw-row { display: flex; gap: 8px; width: 100%; }
  .hw-row button { flex: 1; padding: 10px; border: none; border-radius: 8px; font-size: 0.95rem; cursor: pointer; }
  #hw-clear { background: #eee; color: #555; }
  #hw-recognize { background: #e07b39; color: #fff; }
  #hw-add { background: #5a9e5a; color: #fff; }
  #hw-cancel { background: #ddd; color: #333; }
  #hw-status { font-size: 0.8rem; color: #aaa; min-height: 1em; }
</style>
</head>
<body>
<h1>📖 Chinese Word Practice</h1>

<!-- Scan Screen -->
<div id="scan-screen">
  <img id="preview" alt="preview">
  <p id="status">Take a photo of the textbook page to begin.</p>
  <button class="btn btn-primary" onclick="document.getElementById('file-input').click()">📷 Take / Choose Photo</button>
  <input type="file" id="file-input" accept="image/*" capture="environment">
  <button class="btn btn-gray" id="load-saved-btn" style="display:none;width:100%" onclick="loadSaved()">📂 Use Last Word List</button>
</div>

<!-- Review Screen -->
<div id="review-screen">
  <h2>Review & Edit Words</h2>
  <div id="lessons-container"></div>
  <button id="add-lesson-btn" onclick="addLesson()">+ Add Lesson</button>
  <button id="start-btn" onclick="startPractice()">▶ Start Practice</button>
</div>

<!-- Practice Screen -->
<div id="practice-screen">
  <div id="lesson-tabs"></div>
  <p id="progress"></p>
  <div id="word-box">字</div>
  <div id="pinyin-box"></div>
  <button id="speak-btn" onclick="speak()">🔊 Play Word</button>
  <button id="reveal-btn" class="btn" onclick="revealWord()">👁 Reveal</button>
  <div class="nav-row">
    <button class="btn btn-gray" onclick="go(-1)">◀ Prev</button>
    <button class="btn btn-gray" onclick="go(1)">Next ▶</button>
  </div>
  <button id="back-btn" onclick="showReview()">↩ Back to Edit</button>
</div>

<!-- Handwriting Modal -->
<div id="hw-modal">
  <div id="hw-box">
    <h3>✍️ Draw a character</h3>
    <canvas id="hw-canvas" width="240" height="240"></canvas>
    <p id="hw-status"></p>
    <div id="hw-result"></div>
    <div class="hw-row">
      <button id="hw-clear" onclick="hwClear()">Clear</button>
      <button id="hw-recognize" onclick="hwRecognize()">Read ✨</button>
    </div>
    <div class="hw-row">
      <button id="hw-add" onclick="hwAdd()">Add to Lesson</button>
      <button id="hw-cancel" onclick="hwClose()">Cancel</button>
    </div>
  </div>
</div>

<script src="https://unpkg.com/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
<script src="https://unpkg.com/pinyin-pro@3/dist/index.js"></script>
<script>
// ── State ──────────────────────────────────────────────────────────────
let lessons = [];
let practiceLesson = 0, practiceIdx = 0;
let hwTargetLesson = 0;

// ── Init ───────────────────────────────────────────────────────────────
const saved = localStorage.getItem('chineseLessons');
if (saved) document.getElementById('load-saved-btn').style.display = 'block';

function loadSaved() {
  lessons = JSON.parse(localStorage.getItem('chineseLessons'));
  showReview();
}

// ── Scan & OCR ─────────────────────────────────────────────────────────
document.getElementById('file-input').addEventListener('change', async e => {
  const file = e.target.files[0];
  if (!file) return;
  const url = URL.createObjectURL(file);
  const preview = document.getElementById('preview');
  preview.src = url; preview.style.display = 'block';
  setStatus('Reading image… 20–40 seconds ⏳');
  try {
    const result = await Tesseract.recognize(url, 'chi_sim+chi_tra', {
      logger: m => { if (m.status === 'recognizing text') setStatus(`Reading… ${Math.round(m.progress*100)}%`); }
    });
    const words = result.data.words.filter(w => /[\u4e00-\u9fff]/.test(w.text));
    if (!words.length) { setStatus('No Chinese characters found. Try a clearer photo.'); return; }
    lessons = groupByColumn(words);
    save(); showReview();
  } catch(err) { setStatus('Error: ' + err.message); }
});

function groupByColumn(words) {
  const sorted = [...words].sort((a,b) => a.bbox.y0 - b.bbox.y0);
  const rows = [];
  for (const w of sorted) {
    const cy = (w.bbox.y0 + w.bbox.y1) / 2;
    const row = rows.find(r => Math.abs(r.cy - cy) < 40);
    if (row) { row.words.push(w); row.cy = (row.cy + cy) / 2; }
    else rows.push({ cy, words: [w] });
  }
  return rows.map((row, i) => ({
    name: `Lesson ${i + 1}`,
    words: [...new Set(row.words.sort((a,b) => a.bbox.x0 - b.bbox.x0).map(w => w.text.trim()).filter(Boolean))]
  })).filter(r => r.words.length);
}

function setStatus(msg) { document.getElementById('status').textContent = msg; }

// ── Review Screen ──────────────────────────────────────────────────────
function showReview() {
  document.getElementById('scan-screen').style.display = 'none';
  document.getElementById('practice-screen').style.display = 'none';
  document.getElementById('review-screen').style.display = 'flex';
  renderLessons();
}

function renderLessons() {
  const container = document.getElementById('lessons-container');
  container.innerHTML = '';
  lessons.forEach((lesson, li) => {
    const block = document.createElement('div');
    block.className = 'lesson-block';
    block.innerHTML = `
      <div class="lesson-header">
        <span class="lesson-title"><input value="${lesson.name}" onchange="lessons[${li}].name=this.value"></span>
        <button style="background:none;border:none;font-size:1.1rem;cursor:pointer" title="Draw to add" onclick="hwOpen(${li})">✍️</button>
        <button class="del-lesson" onclick="deleteLesson(${li})">🗑</button>
      </div>
      <div class="words-grid" id="grid-${li}"></div>
      <div class="add-word-row">
        <input placeholder="Add word…" id="add-input-${li}" onkeydown="if(event.key==='Enter')addWord(${li})">
        <button class="btn btn-green" onclick="addWord(${li})">+</button>
      </div>`;
    container.appendChild(block);

    const grid = document.getElementById(`grid-${li}`);

    // Grid is a drop zone for cross-lesson drops onto empty space
    grid.addEventListener('dragover', e => { e.preventDefault(); grid.classList.add('drop-target'); });
    grid.addEventListener('dragleave', () => grid.classList.remove('drop-target'));
    grid.addEventListener('drop', e => {
      e.preventDefault(); grid.classList.remove('drop-target');
      const [fromLi, fromWi] = e.dataTransfer.getData('text/plain').split(',').map(Number);
      if (fromLi === li) return; // handled by chip drop
      const [word] = lessons[fromLi].words.splice(fromWi, 1);
      lessons[li].words.push(word);
      save(); renderLessons();
    });

    lesson.words.forEach((w, wi) => {
      const chip = document.createElement('div');
      chip.className = 'word-chip';
      chip.draggable = true;
      chip.dataset.li = li; chip.dataset.wi = wi;
      chip.innerHTML = `<span>${w}</span><span class="del" onclick="deleteWord(${li},${wi})">✕</span>`;
      chip.addEventListener('dragstart', e => { e.dataTransfer.setData('text/plain', `${li},${wi}`); chip.classList.add('dragging'); });
      chip.addEventListener('dragend', () => chip.classList.remove('dragging'));
      chip.addEventListener('dragover', e => { e.preventDefault(); e.stopPropagation(); chip.classList.add('drag-over'); });
      chip.addEventListener('dragleave', () => chip.classList.remove('drag-over'));
      chip.addEventListener('drop', e => {
        e.preventDefault(); e.stopPropagation(); chip.classList.remove('drag-over');
        const [fromLi, fromWi] = e.dataTransfer.getData('text/plain').split(',').map(Number);
        const toLi = +chip.dataset.li, toWi = +chip.dataset.wi;
        if (fromLi === toLi && fromWi === toWi) return;
        const [word] = lessons[fromLi].words.splice(fromWi, 1);
        // If cross-lesson, insert at target position; same-lesson reorder
        lessons[toLi].words.splice(toWi, 0, word);
        save(); renderLessons();
      });
      grid.appendChild(chip);
    });
  });
}

function deleteWord(li, wi) { lessons[li].words.splice(wi, 1); save(); renderLessons(); }
function deleteLesson(li) { lessons.splice(li, 1); save(); renderLessons(); }
function addWord(li) {
  const inp = document.getElementById(`add-input-${li}`);
  const val = inp.value.trim();
  if (val) { lessons[li].words.push(val); inp.value = ''; save(); renderLessons(); }
}
function addLesson() { lessons.push({ name: `Lesson ${lessons.length + 1}`, words: [] }); save(); renderLessons(); }
function save() { localStorage.setItem('chineseLessons', JSON.stringify(lessons)); }

// ── Handwriting ────────────────────────────────────────────────────────
const hwCanvas = document.getElementById('hw-canvas');
const hwCtx = hwCanvas.getContext('2d');
let hwDrawing = false;

function hwOpen(li) {
  hwTargetLesson = li;
  hwClear();
  document.getElementById('hw-result').textContent = '';
  document.getElementById('hw-status').textContent = '';
  document.getElementById('hw-modal').classList.add('open');
}
function hwClose() { document.getElementById('hw-modal').classList.remove('open'); }

function hwClear() {
  hwCtx.clearRect(0, 0, hwCanvas.width, hwCanvas.height);
  document.getElementById('hw-result').textContent = '';
  document.getElementById('hw-status').textContent = '';
}

function hwPos(e) {
  const r = hwCanvas.getBoundingClientRect();
  const src = e.touches ? e.touches[0] : e;
  return [src.clientX - r.left, src.clientY - r.top];
}

hwCanvas.addEventListener('mousedown', e => { hwDrawing = true; hwCtx.beginPath(); hwCtx.moveTo(...hwPos(e)); });
hwCanvas.addEventListener('mousemove', e => { if (!hwDrawing) return; hwCtx.lineWidth = 6; hwCtx.lineCap = 'round'; hwCtx.strokeStyle = '#222'; hwCtx.lineTo(...hwPos(e)); hwCtx.stroke(); });
hwCanvas.addEventListener('mouseup', () => hwDrawing = false);
hwCanvas.addEventListener('touchstart', e => { e.preventDefault(); hwDrawing = true; hwCtx.beginPath(); hwCtx.moveTo(...hwPos(e)); }, { passive: false });
hwCanvas.addEventListener('touchmove', e => { e.preventDefault(); if (!hwDrawing) return; hwCtx.lineWidth = 6; hwCtx.lineCap = 'round'; hwCtx.strokeStyle = '#222'; hwCtx.lineTo(...hwPos(e)); hwCtx.stroke(); }, { passive: false });
hwCanvas.addEventListener('touchend', () => hwDrawing = false);

async function hwRecognize() {
  document.getElementById('hw-status').textContent = 'Reading…';
  document.getElementById('hw-result').textContent = '';
  try {
    const result = await Tesseract.recognize(hwCanvas, 'chi_sim+chi_tra');
    const text = result.data.text.replace(/\s/g, '').replace(/[^\u4e00-\u9fff]/g, '');
    document.getElementById('hw-result').textContent = text || '?';
    document.getElementById('hw-status').textContent = text ? 'Tap "Add to Lesson" to confirm' : 'Not recognised — try again';
  } catch(e) {
    document.getElementById('hw-status').textContent = 'Error: ' + e.message;
  }
}

function hwAdd() {
  const text = document.getElementById('hw-result').textContent;
  if (!text || text === '?') return;
  [...text].forEach(ch => { if (!lessons[hwTargetLesson].words.includes(ch)) lessons[hwTargetLesson].words.push(ch); });
  save(); renderLessons(); hwClose();
}

// ── Practice Screen ────────────────────────────────────────────────────
function startPractice() {
  practiceLesson = 0; practiceIdx = 0;
  document.getElementById('review-screen').style.display = 'none';
  document.getElementById('practice-screen').style.display = 'flex';
  renderTabs(); render();
}

function renderTabs() {
  const tabs = document.getElementById('lesson-tabs');
  tabs.innerHTML = '';
  lessons.forEach((l, i) => {
    const t = document.createElement('button');
    t.className = 'tab' + (i === practiceLesson ? ' active' : '');
    t.textContent = l.name;
    t.onclick = () => { practiceLesson = i; practiceIdx = 0; renderTabs(); render(); };
    tabs.appendChild(t);
  });
}

function render() {
  const words = lessons[practiceLesson].words;
  document.getElementById('progress').textContent = `${practiceIdx + 1} / ${words.length}`;
  document.getElementById('word-box').textContent = words[practiceIdx];
  document.getElementById('word-box').style.visibility = 'hidden';
  document.getElementById('pinyin-box').textContent = '';
}

function revealWord() {
  const word = lessons[practiceLesson].words[practiceIdx];
  document.getElementById('word-box').style.visibility = 'visible';
  document.getElementById('pinyin-box').textContent = pinyinPro.pinyin(word, { toneType: 'symbol', separator: ' ' });
}

function speak() {
  const word = lessons[practiceLesson].words[practiceIdx];
  const u = new SpeechSynthesisUtterance(word);
  u.lang = 'zh-CN'; u.rate = 0.85;
  speechSynthesis.cancel(); speechSynthesis.speak(u);
}

function go(dir) {
  const words = lessons[practiceLesson].words;
  practiceIdx = Math.max(0, Math.min(words.length - 1, practiceIdx + dir));
  render();
}
</script>
</body>
</html>
